<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c42a2a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Cierre de Caja Senderos</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#1c2a22;--mut:#5d6b63;--line:#d9e0db;--pri:#c42a2a;--pri-ink:#fff;--warn:#b3261e;--ok:#1f5f3b;--soft:#e7f0ea}
@media (prefers-color-scheme:dark){:root{--bg:#131a16;--card:#1c2620;--ink:#e8efe9;--mut:#9fb0a5;--line:#2d3b33;--pri:#c42a2a;--pri-ink:#fff;--warn:#ff8a80;--ok:#7fd6a0;--soft:#24332a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:84px}
header{background:var(--pri);color:var(--pri-ink);padding:12px 16px;position:sticky;top:0;z-index:5}
header{display:flex;align-items:center;gap:10px}header img{width:36px;height:36px;border-radius:6px}
header h1{margin:0;font-size:18px}header small{opacity:.9}
main{padding:12px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{flex:1;min-width:0}.row .n b{display:block}.row .n small{color:var(--mut)}
.sub{min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:22px}
.step input{width:60px;height:44px;text-align:center;font-size:18px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=number]{width:100%}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--pri);color:var(--pri-ink);font-size:17px;font-weight:600;margin:8px 0}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:#fff}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.tot.big{font-size:20px;font-weight:700;border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.warn{color:var(--warn)}.ok{color:var(--ok)}.mut{color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--soft);font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0;border:0;background:none;color:var(--mut);font-size:11px}
nav button.on{color:var(--pri);font-weight:700}
nav button span{display:block;font-size:20px}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9;text-align:center}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:16px}
</style>
</head>
<body>
<header><img src="icon-192.png" alt="SC"><div><h1>Cierre de Caja · Senderos de Colón</h1><small id="hsub"></small></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
var KEY = 'senderos_cierre_v1';
var S = load();
var view = 'hoy';
var fechaVista = hoy();
var adminUntil = 0;
var memStore = null;

/* ---------- datos iniciales (se cambian por CSV desde Admin) ---------- */
function seed() {
  return {
    v: 1,
    config: { pin: '', siguiente: 1, fondo: 30000 },
    catalogo: {
      productos: [
        { codigo: 'POWERADE591', nombre: 'Powerade 591 ml', precio: 1500, costo: 0, unidad_compra: 'Caja', unidades_empaque: 12, existencia_inicial: 43, minimo: 12, activo: 1 },
        { codigo: 'POWERADE600', nombre: 'Powerade 600 ml', precio: 1500, costo: 0, unidad_compra: 'Caja', unidades_empaque: 12, existencia_inicial: 27, minimo: 12, activo: 1 },
        { codigo: 'AGUA', nombre: 'Agua Alpina 600 ml', precio: 1000, costo: 0, unidad_compra: 'Caja', unidades_empaque: 24, existencia_inicial: 24, minimo: 12, activo: 1 },
        { codigo: 'COCA355', nombre: 'Coca Cola 355 ml', precio: 1000, costo: 0, unidad_compra: 'Caja', unidades_empaque: 12, existencia_inicial: 0, minimo: 12, activo: 1 },
        { codigo: 'COCAMINI', nombre: 'Coca Cola Mini (vidrio)', precio: 500, costo: 0, unidad_compra: 'Caja', unidades_empaque: 1, existencia_inicial: 0, minimo: 0, activo: 1 },
        { codigo: 'BARRITA', nombre: 'Barrita de proteína', precio: 1000, costo: 0, unidad_compra: 'Caja', unidades_empaque: 26, existencia_inicial: 78, minimo: 5, activo: 1 }
      ],
      ingresos: [
        { codigo: 'TR', nombre: 'Trail Running', precio: 3500, activo: 1 },
        { codigo: 'MTB', nombre: 'Mountain Bike', precio: 5000, activo: 1 },
        { codigo: 'MEMB', nombre: 'Membresías', precio: 40000, activo: 1 }
      ],
      egresos: [
        { codigo: 'PROVEEDOR', nombre: 'Pago a proveedor (FEMSA, etc.)', activo: 1 },
        { codigo: 'CRUZROJA', nombre: 'Cruz Roja', activo: 1 },
        { codigo: 'FRUTA', nombre: 'Fruta', activo: 1 },
        { codigo: 'VIATICOS', nombre: 'Viáticos', activo: 1 },
        { codigo: 'JORNALES', nombre: 'Jornales', activo: 1 },
        { codigo: 'AGUINALDO', nombre: 'Aguinaldo', activo: 1 },
        { codigo: 'OTROS', nombre: 'Otros', activo: 1 }
      ]
    },
    llegadas: [], ajustes: [], dias: {}, ultimoCajero: '', efectivo: { entregas: [], arqueos: [] }
  };
}
function migrar(s) {
  s.config = s.config || {};
  if (s.config.fondo === undefined) s.config.fondo = 30000;
  if (!s.trabajadores) s.trabajadores = [];
  if (!s.horas) s.horas = {};
  if (!s.efectivo) s.efectivo = { entregas: [], arqueos: [] };
  if (!s.efectivo.entregas) s.efectivo.entregas = [];
  if (!s.efectivo.arqueos) s.efectivo.arqueos = [];
  [['PROVEEDOR', 'Pago a proveedor (FEMSA, etc.)'], ['CRUZROJA', 'Cruz Roja']].forEach(function (x) {
    if (!byCod(s.catalogo.egresos, x[0])) s.catalogo.egresos.unshift({ codigo: x[0], nombre: x[1], activo: 1 });
  });
  return s;
}
function load() {
  try { var j = localStorage.getItem(KEY); if (j) return migrar(JSON.parse(j)); } catch (e) {}
  return migrar(seed());
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); memStore = null; }
  catch (e) { memStore = true; toast('⚠ No se pudo guardar en el teléfono. Exportá el CSV ya.'); }
}

/* ---------- utilidades ---------- */
function hoy() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function p2(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return '₡' + Math.round(n || 0).toLocaleString('es-CR'); }
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, 3500); }
function byCod(list, cod) { for (var i = 0; i < list.length; i++) if (list[i].codigo === cod) return list[i]; return null; }
function fechaBonita(f) { var a = f.split('-'); return a[2] + '/' + a[1] + '/' + a[0]; }

function emptyDay(f) { return { fecha: f, numero: null, cajero: S.ultimoCajero || '', cerrado: false, ingresos: {}, ventas: {}, consumo: {}, egresos: {}, gastos: [], extras: [], sinpe: [], efectivo_contado: '', snap: null }; }
function getDay(f) { return S.dias[f] || emptyDay(f); }
function ensureDay(f) { if (!S.dias[f]) S.dias[f] = emptyDay(f); var d = S.dias[f]; if (!d.extras) d.extras = []; if (!d.sinpe) d.sinpe = []; if (!d.gastos) d.gastos = []; return d; }
var CHIPS = [500, 1000, 1500, 2000, 5000, 10000, 20000, 40000];

function prices(d) {
  if (d.cerrado && d.snap) return d.snap;
  var s = { ingresos: {}, productos: {} };
  S.catalogo.ingresos.forEach(function (i) { s.ingresos[i.codigo] = { nombre: i.nombre, precio: i.precio }; });
  S.catalogo.productos.forEach(function (i) { s.productos[i.codigo] = { nombre: i.nombre, precio: i.precio }; });
  S.catalogo.egresos.forEach(function (i) { s.egresos = s.egresos || {}; s.egresos[i.codigo] = { nombre: i.nombre }; });
  return s;
}
function totals(d) {
  var P = prices(d), t = { ing: 0, ven: 0, egr: 0 };
  Object.keys(d.ingresos).forEach(function (c) { if (P.ingresos[c]) t.ing += d.ingresos[c] * P.ingresos[c].precio; });
  Object.keys(d.ventas).forEach(function (c) { if (P.productos[c]) t.ven += d.ventas[c] * P.productos[c].precio; });
  Object.keys(d.egresos).forEach(function (c) { t.egr += num(d.egresos[c]); });
  (d.gastos || []).forEach(function (g) { t.egr += g.monto; });
  (d.extras || []).forEach(function (x) { var m = x.cantidad * x.precio; if (x.tipo === 'ingreso') t.ing += m; else t.ven += m; });
  t.totalIng = t.ing + t.ven;
  t.general = t.totalIng - t.egr;
  t.sinpe = 0; (d.sinpe || []).forEach(function (s) { t.sinpe += s.monto; });
  t.nSinpe = (d.sinpe || []).length;
  t.ventasEfectivo = t.totalIng - t.sinpe;
  t.efectivo = t.general - t.sinpe;
  return t;
}
/* Efectivo que debería haber en la caja: caja chica + ventas en efectivo - egresos - entregas a Roberto + ajustes de conteo */
function efectivoEsperado(exclDia) {
  var e = num(S.config.fondo);
  Object.keys(S.dias).forEach(function (f) { var t = totals(S.dias[f]); e += t.totalIng - t.sinpe - t.egr; });
  S.efectivo.entregas.forEach(function (x) { e -= x.monto; });
  S.efectivo.arqueos.forEach(function (a) { if (!(exclDia && a.dia === exclDia)) e += a.dif; });
  return e;
}
function stock(cod) {
  var p = byCod(S.catalogo.productos, cod); if (!p) return 0;
  var s = num(p.existencia_inicial);
  S.llegadas.forEach(function (l) { if (l.codigo === cod) s += l.unidades; });
  S.ajustes.forEach(function (a) { if (a.codigo === cod) s += a.delta; });
  Object.keys(S.dias).forEach(function (f) {
    var d = S.dias[f]; s -= (d.ventas[cod] || 0) + (d.consumo[cod] || 0);
    (d.extras || []).forEach(function (x) { if (x.tipo === 'venta' && x.codigo === cod) s -= x.cantidad; });
  });
  return s;
}

/* ---------- vistas ---------- */
var TABS = [['hoy', '🧾', 'Hoy'], ['efectivo', '💵', 'Efectivo'], ['horas', '⏱️', 'Horas'], ['llegadas', '📦', 'Inventario'], ['export', '📤', 'Enviar'], ['admin', '⚙️', 'Admin']];
function render() {
  var y = window.scrollY;
  document.getElementById('nav').innerHTML = TABS.map(function (t) {
    return '<button data-act="tab" data-v="' + t[0] + '" class="' + (view === t[0] ? 'on' : '') + '"><span>' + t[1] + '</span>' + t[2] + '</button>';
  }).join('');
  document.getElementById('hsub').textContent = (view === 'hoy' ? fechaBonita(fechaVista) + ' · ' : '') + (navigator.onLine ? 'Funciona sin internet' : 'Sin conexión: todo se guarda en el teléfono');
  var h = { hoy: vHoy, efectivo: vEfectivo, horas: vHoras, llegadas: function () { return vLlegadas() + vStock(); }, export: vExport, admin: vAdmin }[view]();
  document.getElementById('app').innerHTML = h;
  window.scrollTo(0, y);
}
function stepper(sec, cod, val, dis) {
  return '<div class="step"><button data-act="step" data-sec="' + sec + '" data-cod="' + esc(cod) + '" data-d="-1"' + (dis ? ' disabled' : '') + '>−</button>' +
    '<input type="number" inputmode="numeric" min="0" value="' + (val || 0) + '" data-f="' + sec + '" data-cod="' + esc(cod) + '"' + (dis ? ' disabled' : '') + '>' +
    '<button data-act="step" data-sec="' + sec + '" data-cod="' + esc(cod) + '" data-d="1"' + (dis ? ' disabled' : '') + '>+</button></div>';
}
function vHoy() {
  var d = getDay(fechaVista), P = prices(d), lock = d.cerrado, t = totals(d), h = '';
  h += '<div class="card"><div class="grid2"><div><label>Fecha</label><input type="date" data-f="fecha" value="' + fechaVista + '"></div>' +
    '<div><label>Cajero(a)</label><input type="text" data-f="cajero" value="' + esc(d.cajero) + '"' + (lock ? ' disabled' : '') + '></div></div>' +
    (lock ? '<p class="ok"><b>Día cerrado</b> · Cierre N° ' + d.numero + '</p>' : '<p class="mut">Día abierto. Tocá + / − o escribí la cantidad.</p>') + '</div>';
  h += '<div class="card"><h2>Ingresos</h2>';
  S.catalogo.ingresos.filter(function (i) { return i.activo != 0 || d.ingresos[i.codigo]; }).forEach(function (i) {
    var pr = P.ingresos[i.codigo] || i, q = d.ingresos[i.codigo] || 0;
    h += '<div class="row"><div class="n"><b>' + esc(pr.nombre) + '</b><small>' + fmt(pr.precio) + ' c/u</small></div>' + stepper('ingresos', i.codigo, q, lock) + '<div class="sub">' + fmt(q * pr.precio) + '</div></div>';
  });
  h += extrasHtml('ingreso', d, lock) + '</div><div class="card"><h2>Ventas</h2>';
  S.catalogo.productos.filter(function (i) { return i.activo != 0 || d.ventas[i.codigo]; }).forEach(function (i) {
    var pr = P.productos[i.codigo] || i, q = d.ventas[i.codigo] || 0, st = stock(i.codigo);
    h += '<div class="row"><div class="n"><b>' + esc(pr.nombre) + '</b><small>' + fmt(pr.precio) + ' c/u · quedan <span class="' + (st < 0 ? 'warn' : '') + '">' + st + '</span></small></div>' + stepper('ventas', i.codigo, q, lock) + '<div class="sub">' + fmt(q * pr.precio) + '</div></div>';
  });
  h += extrasHtml('venta', d, lock) + '</div><div class="card"><h2>Consumo interno (no se cobra)</h2>';
  S.catalogo.productos.filter(function (i) { return i.activo != 0 || d.consumo[i.codigo]; }).forEach(function (i) {
    h += '<div class="row"><div class="n"><b>' + esc(i.nombre) + '</b></div>' + stepper('consumo', i.codigo, d.consumo[i.codigo] || 0, lock) + '</div>';
  });
  h += '</div>' + sinpeHtml(d, lock) + gastosHtml(d, lock);
  var arq = null; S.efectivo.arqueos.forEach(function (a) { if (a.dia === fechaVista) arq = a; });
  var esp = arq ? arq.esperado : efectivoEsperado(fechaVista), cont = arq ? arq.contado : d.efectivo_contado;
  h += '<div class="card"><h2>Resumen del día</h2><div class="tot"><span>Entradas y membresías</span><span>' + fmt(t.ing) + '</span></div>' +
    '<div class="tot"><span>Ventas</span><span>' + fmt(t.ven) + '</span></div>' +
    '<div class="tot"><b>Total ingresos</b><b>' + fmt(t.totalIng) + '</b></div>' +
    '<div class="tot"><span>Pagado por SINPE (' + t.nSinpe + ')</span><span>' + fmt(t.sinpe) + '</span></div>' +
    '<div class="tot"><span>Vendido en efectivo</span><span>' + fmt(t.ventasEfectivo) + '</span></div>' +
    '<div class="tot"><span>Egresos pagados en efectivo</span><span>' + fmt(t.egr) + '</span></div>' +
    (t.sinpe > t.totalIng ? '<p class="warn">⚠ Los SINPE superan los ingresos del día: revisá.</p>' : '') + '</div>';
  h += '<div class="card"><h2>Caja</h2>' +
    '<div class="tot"><span>Caja chica (para vueltos)</span><span>' + fmt(S.config.fondo) + '</span></div>' +
    '<div class="tot big"><span>Debería haber en caja' + (arq ? ' (al cerrar)' : '') + '</span><span>' + fmt(esp) + '</span></div>' +
    '<label>Efectivo en caja: contá TODO (incluida la caja chica)</label><input type="number" inputmode="decimal" data-f="efectivo_contado" value="' + esc(cont) + '"' + (lock ? ' disabled' : '') + '>' +
    (cont !== undefined && cont !== '' ? (function () { var df = num(cont) - esp; return Math.abs(df) < 0.5 ? '<p class="ok"><b>Cuadra ✔</b></p>' : '<p class="' + (df > 0 ? 'ok' : 'warn') + '"><b>' + (df > 0 ? 'Sobra ' : 'Falta ') + fmt(Math.abs(df)) + '</b></p>'; })() : '') +
    '</div>';
  h += lock ? '<button class="btn sec" data-act="reabrir">Reabrir día (Admin)</button>' : '<button class="btn" data-act="cerrar">Cerrar día</button>';
  return h;
}
function gastosHtml(d, lock) {
  var h = '<div class="card"><h2>Egresos (sale del efectivo de la caja)</h2>', tot = 0;
  Object.keys(d.egresos).forEach(function (c) {
    if (!num(d.egresos[c])) return;
    var e = byCod(S.catalogo.egresos, c); tot += num(d.egresos[c]);
    h += '<div class="row"><div class="n"><b>' + esc(e ? e.nombre : c) + '</b><small>registro anterior</small></div><div class="sub">' + fmt(num(d.egresos[c])) + '</div>' +
      (lock ? '' : '<button class="btn sec" style="width:auto;margin:0;padding:8px 12px" data-act="egr-leg-del" data-cod="' + esc(c) + '">Quitar</button>') + '</div>';
  });
  (d.gastos || []).forEach(function (g, i) {
    tot += g.monto;
    h += '<div class="row"><div class="n"><b>' + esc(g.nombre) + '</b><small>' + esc(g.hora) + (g.nota ? ' · ' + esc(g.nota) : '') + '</small></div><div class="sub">' + fmt(g.monto) + '</div>' +
      (lock ? '' : '<button class="btn sec" style="width:auto;margin:0;padding:8px 12px" data-act="egr-del" data-i="' + i + '">Quitar</button>') + '</div>';
  });
  if (!tot) h += '<p class="mut">Todavía no hay egresos hoy.</p>';
  h += '<div class="tot"><b>Total egresos</b><b>' + fmt(tot) + '</b></div>';
  if (!lock) {
    h += '<label>Categoría</label><select id="g_c" style="width:100%">' + S.catalogo.egresos.filter(function (c) { return c.activo != 0; }).map(function (c) { return '<option value="' + esc(c.codigo) + '">' + esc(c.nombre) + '</option>'; }).join('') + '</select>' +
      '<div class="grid2"><div><label>Monto (₡)</label><input type="number" inputmode="decimal" id="g_m" min="1"></div>' +
      '<div><label>Nota</label><input type="text" id="g_n" placeholder="ej. FEMSA, factura"></div></div>' +
      '<button class="btn" data-act="egr-add">Agregar egreso</button>';
  }
  return h + '</div>';
}
function vEfectivo() {
  var esp = efectivoEsperado(), fondo = num(S.config.fondo), entregar = Math.max(0, esp - fondo);
  var h = '<div class="card"><h2>Efectivo en caja</h2><div class="tot big"><span>Debería haber</span><span>' + fmt(esp) + '</span></div>' +
    '<div class="tot"><span>Caja chica (para vueltos)</span><span>' + fmt(fondo) + '</span></div>' +
    '<div class="tot"><b>Para entregar a Roberto</b><b>' + fmt(entregar) + '</b></div>' +
    (esp < fondo ? '<p class="warn">⚠ Hay menos que la caja chica. Revisá.</p>' : '') +
    '<p class="mut">Esto incluye lo vendido en efectivo, menos los egresos y lo que ya se entregó.</p></div>';
  h += '<div class="card"><h2>Contar la caja / entregar a Roberto</h2>' +
    '<p class="mut">1) Contá TODO el efectivo de la caja, con la caja chica. 2) Escribilo acá. 3) Si le entregás a Roberto, escribí cuánto (el app sugiere lo que sobra de la caja chica). Si solo querés contar, dejá la entrega en 0.</p>' +
    '<label>Efectivo contado en la caja (total)</label><input type="number" inputmode="decimal" id="c_cont" data-f="c_cont">' +
    '<label>Le entrego a Roberto (₡)</label><input type="number" inputmode="decimal" id="c_ent" placeholder="0 = solo contar">' +
    '<label>Nota (obligatoria si hay diferencia)</label><input type="text" id="c_nota" style="width:100%">' +
    '<button class="btn" data-act="efe-reg">Registrar</button></div>';
  var ev = [];
  S.efectivo.entregas.forEach(function (x) { ev.push({ f: x.fecha, h: x.hora, t: 'Entrega a Roberto', m: x.monto, n: x.nota, id: x.id, ent: true }); });

      (d.gastos || []).forEach(function (g) { sinpeIdx[L.length] = true; L.push(csvLine(b.concat(['egreso', g.cat, g.nombre + (g.nota ? ' (' + g.nota + ')' : ''), 1, g.monto, g.monto, g.hora]))); });
      L.push(csvLine(b.concat(['resumen', 'TOTAL_INGRESOS', 'Total ingresos', '', '', t.totalIng])));
      L.push(csvLine(b.concat(['resumen', 'TOTAL_EGRESOS', 'Total egresos', '', '', t.egr])));
      L.push(csvLine(b.concat(['resumen', 'TOTAL_GENERAL', 'Total general', '', '', t.general])));
      L.push(csvLine(b.concat(['resumen', 'SINPE_TOTAL', 'Total por SINPE', t.nSinpe, '', t.sinpe])));
      L.push(csvLine(b.concat(['resumen', 'VENTAS_EFECTIVO', 'Vendido en efectivo (ingresos - SINPE)', '', '', t.ventasEfectivo])));
      S.efectivo.arqueos.forEach(function (a) {
        if (a.dia !== f) return;
        L.push(csvLine(b.concat(['resumen', 'CAJA_ESPERADA', 'Debería haber en caja al cerrar', '', '', a.esperado])));
        L.push(csvLine(b.concat(['resumen', 'CAJA_CONTADA', 'Efectivo contado en caja', '', '', a.contado])));
        L.push(csvLine(b.concat(['resumen', 'CAJA_DIFERENCIA', 'Diferencia (contado - esperado)', '', '', a.dif])));
      });
    });
    L = L.map(function (l, i) { return (i === 0 || sinpeIdx[i]) ? l : l + ','; });
    n = 'cierres_' + d1 + '_a_' + d2 + '.csv';
  } else if (k === 'horas') {
    L.push(csvLine(['fecha', 'codigo', 'trabajador', 'estado', 'entrada', 'salida', 'horas_totales', 'horas_en_horario', 'horario_entrada', 'horario_salida', 'jornada', 'atraso_min', 'salida_antes_min', 'horas_extra_estimadas', 'editado', 'marca_entrada', 'marca_salida', 'nota']));
    Object.keys(S.horas).sort().forEach(function (f) {
      if (f < d1 || f > d2) return;
      S.trabajadores.forEach(function (w) {
        var r = S.horas[f][w.codigo]; if (!r || (!r.estado && !r.ent && !r.sal)) return;
        var c = calcHoras(w, r, f);
        L.push(csvLine([f, w.codigo, w.nombre, r.estado || 'trabajo', r.ent, r.sal, c.horas.toFixed(2), c.enHorario.toFixed(2), c.sched.ent, c.sched.sal, c.sched.jornada, c.atraso, c.antes, c.extra.toFixed(2), r.editado ? 'si' : 'no', r.ent_marca, r.sal_marca, r.nota || '']));
      });
    });
    n = 'horas_' + d1 + '_a_' + d2 + '.csv';
  } else if (k === 'efectivo') {
    var E = [];
    Object.keys(S.dias).forEach(function (f) {
      var d = S.dias[f], t = totals(d);
      E.push([f, '00:00', 'venta_efectivo', t.ventasEfectivo, 'Vendido en efectivo del día (ingresos - SINPE)', d.cajero, 1]);
      Object.keys(d.egresos).forEach(function (c) { if (num(d.egresos[c])) { var e = byCod(S.catalogo.egresos, c); E.push([f, '00:00', 'egreso', -num(d.egresos[c]), e ? e.nombre : c, d.cajero, 2]); } });
      (d.gastos || []).forEach(function (g) { E.push([f, g.hora || '00:00', 'egreso', -g.monto, g.nombre + (g.nota ? ' (' + g.nota + ')' : ''), d.cajero, 2]); });
    });
    S.efectivo.entregas.forEach(function (x) { E.push([x.fecha, x.hora, 'entrega_a_roberto', -x.monto, x.nota || '', x.cajero, 3]); });
    S.efectivo.arqueos.forEach(function (a) { E.push([a.fecha, a.hora, 'conteo_' + a.origen, a.dif, 'esperado ' + Math.round(a.esperado) + ' · contado ' + Math.round(a.contado) + (a.nota ? ' · ' + a.nota : ''), '', 4]); });
    E.sort(function (a, b) { return a[0] !== b[0] ? (a[0] < b[0] ? -1 : 1) : (a[1] !== b[1] ? (a[1] < b[1] ? -1 : 1) : a[6] - b[6]); });
    var bal = num(S.config.fondo), antes = true;
    L.push(csvLine(['fecha', 'hora', 'tipo', 'monto', 'saldo_esperado', 'detalle', 'cajero']));
    E.forEach(function (e) {
      if (e[0] < d1) { bal += e[3]; return; }
      if (antes) { L.push(csvLine([d1, '', 'saldo_inicial_del_rango', bal, bal, 'Efectivo esperado al empezar el rango', ''])); antes = false; }
      bal += e[3];
      if (e[0] <= d2) L.push(csvLine([e[0], e[1], e[2], e[3], bal, e[4], e[5]]));
    });
    if (antes) L.push(csvLine([d1, '', 'saldo_inicial_del_rango', bal, bal, 'Sin movimientos en el rango', '']));
    n = 'efectivo_' + d1 + '_a_' + d2 + '.csv';
  } else if (k === 'sinpe') {
    L.push(csvLine(['fecha', 'hora', 'monto', 'nota', 'cajero', 'dia_cerrado']));
    Object.keys(S.dias).sort().forEach(function (f) {
      if (f < d1 || f > d2) return;
      var d = S.dias[f];
      (d.sinpe || []).forEach(function (s) { L.push(csvLine([f, s.hora, s.monto, s.nota || '', d.cajero, d.cerrado ? 'si' : 'no'])); });
    });
    n = 'sinpe_' + d1 + '_a_' + d2 + '.csv';
  } else if (k === 'mov') {
    L.push(csvLine(['fecha', 'codigo', 'producto', 'tipo', 'unidades', 'detalle']));
    var M = [];
    S.llegadas.forEach(function (l) { M.push([l.fecha, l.codigo, 'llegada', l.unidades, l.nota || '']); });
    S.ajustes.forEach(function (a) { M.push([a.fecha, a.codigo, 'ajuste', a.delta, a.motivo || '']); });
    Object.keys(S.dias).forEach(function (f) {
      Object.keys(S.dias[f].ventas).forEach(function (c) { if (S.dias[f].ventas[c]) M.push([f, c, 'venta', -S.dias[f].ventas[c], '']); });
      Object.keys(S.dias[f].consumo).forEach(function (c) { if (S.dias[f].consumo[c]) M.push([f, c, 'consumo_interno', -S.dias[f].consumo[c], '']); });
      (S.dias[f].extras || []).forEach(function (x) { if (x.tipo === 'venta') M.push([f, x.codigo, 'venta_precio_distinto', -x.cantidad, x.nota || '']); });
    });
    M.filter(function (m) { return m[0] >= d1 && m[0] <= d2; }).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; }).forEach(function (m) {
      var p = byCod(S.catalogo.productos, m[1]); L.push(csvLine([m[0], m[1], p ? p.nombre : m[1], m[2], m[3], m[4]]));
    });
    n = 'movimientos_' + d1 + '_a_' + d2 + '.csv';
  } else {
    L.push(csvLine(['fecha', 'codigo', 'producto', 'existencia', 'minimo']));
    S.catalogo.productos.forEach(function (p) { L.push(csvLine([hoy(), p.codigo, p.nombre, stock(p.codigo), p.minimo])); });
    n = 'existencias_' + hoy() + '.csv';
  }
  if (ret) return [n, L];
  sendFile(n, L);
}

/* ---------- acciones ---------- */
function pedirPin() {
  if (!S.config.pin) { toast('Solo Roberto puede reabrir un día cerrado. Avisale.'); return false; }
  var v = prompt('PIN de Roberto para reabrir el día:'); if (v === null) return false;
  if (v === String(S.config.pin)) { adminUntil = Date.now() + 5 * 60000; return true; }
  toast('PIN incorrecto'); return false;
}
function readFile(id, cb) {
  var f = document.getElementById(id).files[0]; if (!f) { toast('Elegí un archivo CSV'); return; }
  var r = new FileReader(); r.onload = function () { cb(parseCSV(String(r.result))); }; r.readAsText(f, 'utf-8');
}
function setQty(sec, cod, v) {
  var d = ensureDay(fechaVista); if (d.cerrado) return;
  v = Math.max(0, Math.floor(num(v))); if (v) d[sec][cod] = v; else delete d[sec][cod];
  save(); render();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act;
  if (a === 'tab') { view = b.dataset.v; render(); window.scrollTo(0, 0); }
  else if (a === 'step') { var d = getDay(fechaVista); setQty(b.dataset.sec, b.dataset.cod, (d[b.dataset.sec][b.dataset.cod] || 0) + parseInt(b.dataset.d, 10)); }
  else if (a === 'cerrar') {
    var d = getDay(fechaVista), t = totals(d);
    if (!d.cajero.trim()) { toast('Escribí el nombre del cajero'); return; }
    if (d.efectivo_contado === '' || d.efectivo_contado === undefined) { toast('Contá el efectivo de la caja y escribilo en "Caja" antes de cerrar'); return; }
    var espc = efectivoEsperado(fechaVista), contc = num(d.efectivo_contado), difc = contc - espc;
    if (!confirm('¿Cerrar el día ' + fechaBonita(fechaVista) + '?\nSINPE: ' + fmt(t.sinpe) + ' · Vendido en efectivo: ' + fmt(t.ventasEfectivo) + '\nDebería haber en caja: ' + fmt(espc) + '\nContado: ' + fmt(contc) + (Math.abs(difc) < 0.5 ? ' ✔ cuadra' : (difc > 0 ? ' · sobra ' : ' · falta ') + fmt(Math.abs(difc))) + '\nDespués solo Roberto puede reabrirlo.')) return;
    d = ensureDay(fechaVista); d.snap = prices(d); d.numero = S.config.siguiente++; d.cerrado = true;
    var nw = new Date();
    S.efectivo.arqueos.push({ id: Date.now(), fecha: fechaVista, hora: p2(nw.getHours()) + ':' + p2(nw.getMinutes()), dia: fechaVista, esperado: espc, contado: contc, dif: difc, origen: 'cierre', nota: '' });
    save(); render(); toast('Día cerrado. Cierre N° ' + d.numero);
  }
  else if (a === 'reabrir') {
    if (pedirPin()) {
      var dd = ensureDay(fechaVista); dd.cerrado = false; dd.snap = null;
      S.efectivo.arqueos = S.efectivo.arqueos.filter(function (x) { return x.dia !== fechaVista; });
      save(); render(); toast('Día reabierto');
    }
  }
  else if (a === 'egr-add') {
    var dg = ensureDay(fechaVista); if (dg.cerrado) return;
    var cg = byCod(S.catalogo.egresos, document.getElementById('g_c').value), mg = Math.round(num(document.getElementById('g_m').value));
    if (!cg || mg <= 0) { toast('Poné un monto'); return; }
    var ng = new Date();
    dg.gastos.push({ cat: cg.codigo, nombre: cg.nombre, monto: mg, nota: document.getElementById('g_n').value.trim(), hora: p2(ng.getHours()) + ':' + p2(ng.getMinutes()) });
    save(); render(); toast('Egreso agregado: ' + fmt(mg));
  }
  else if (a === 'egr-del') { var dh = ensureDay(fechaVista); if (!dh.cerrado) { dh.gastos.splice(parseInt(b.dataset.i, 10), 1); save(); render(); } }
  else if (a === 'egr-leg-del') { var di = ensureDay(fechaVista); if (!di.cerrado) { delete di.egresos[b.dataset.cod]; save(); render(); } }
  else if (a === 'efe-reg') {
    var cc = num(document.getElementById('c_cont').value), en = num(document.getElementById('c_ent').value), nt = document.getElementById('c_nota').value.trim();
    if (cc <= 0) { toast('Escribí cuánto efectivo hay en la caja'); return; }
    if (en < 0 || en > cc) { toast('Lo que entregás no puede ser más que lo contado'); return; }
    var er = efectivoEsperado(), df = cc - er;
    if (Math.abs(df) >= 0.5 && !nt) { toast('Hay diferencia (' + (df > 0 ? 'sobra ' : 'falta ') + fmt(Math.abs(df)) + '): escribí una nota'); return; }
    if (!confirm('Esperado según el app: ' + fmt(er) + '\nContado: ' + fmt(cc) + (Math.abs(df) < 0.5 ? ' ✔ cuadra' : (df > 0 ? ' · sobra ' : ' · falta ') + fmt(Math.abs(df))) +
      (en > 0 ? '\nEntregás a Roberto: ' + fmt(en) + '\nQueda en caja: ' + fmt(cc - en) + ' (caja chica: ' + fmt(S.config.fondo) + ')' : '\nSolo se registra el conteo.') + '\n¿Confirmar?')) return;
    var nn = new Date(), hh = p2(nn.getHours()) + ':' + p2(nn.getMinutes()), idn = Date.now();
    S.efectivo.arqueos.push({ id: idn, fecha: hoy(), hora: hh, dia: '', esperado: er, contado: cc, dif: df, origen: en > 0 ? 'entrega' : 'manual', nota: nt });
    if (en > 0) S.efectivo.entregas.push({ id: idn + 1, arq: idn, fecha: hoy(), hora: hh, monto: en, nota: nt, cajero: S.ultimoCajero || '', esperado: er, contado: cc });
    save(); render(); toast(en > 0 ? 'Entrega registrada: ' + fmt(en) : 'Conteo registrado');
  }
  else if (a === 'efe-del') {
    var ent = S.efectivo.entregas.filter(function (x) { return String(x.id) === b.dataset.id; })[0];
    if (ent && ent.fecha === hoy() && confirm('¿Anular esta entrega de ' + fmt(ent.monto) + '?')) {
      S.efectivo.entregas = S.efectivo.entregas.filter(function (x) { return x.id !== ent.id; });
      S.efectivo.arqueos = S.efectivo.arqueos.filter(function (x) { return x.id !== ent.arq; });
      save(); render();
    }
  }
  else if (a === 'llegada') {
    var cod = document.getElementById('l_prod').value, p = byCod(S.catalogo.productos, cod);
    var u = Math.floor(num(document.getElementById('l_emp').value)) * num(p.unidades_empaque) + Math.floor(num(document.getElementById('l_uni').value));
    if (u <= 0) { toast('Poné una cantidad'); return; }
    S.llegadas.push({ id: Date.now(), fecha: document.getElementById('l_fecha').value || hoy(), codigo: cod, unidades: u, nota: document.getElementById('l_nota').value, creado: hoy() });
    save(); render(); toast('Llegada registrada: +' + u + ' unidades');
  }

  else if (a === 'extra-open') { extraForm = b.dataset.tipo; render(); }
  else if (a === 'extra-cancel') { extraForm = null; render(); }
  else if (a === 'extra-add') {
    var tp = b.dataset.tipo, cat = tp === 'ingreso' ? S.catalogo.ingresos : S.catalogo.productos, it = byCod(cat, document.getElementById('e_c').value);
    var q = Math.floor(num(document.getElementById('e_q').value)), pr = num(document.getElementById('e_p').value);
    if (!it || q <= 0) { toast('Poné una cantidad'); return; }
    var dx = ensureDay(fechaVista); if (dx.cerrado) return;
    dx.extras.push({ tipo: tp, codigo: it.codigo, nombre: it.nombre, cantidad: q, precio: pr, nota: document.getElementById('e_n').value.trim() });
    extraForm = null; save(); render(); toast('Agregado a precio distinto');
  }
  else if (a === 'extra-del') { var dy = ensureDay(fechaVista); if (!dy.cerrado) { dy.extras.splice(parseInt(b.dataset.i, 10), 1); save(); render(); } }
  else if (a === 'sinpe-chip') { var sn = document.getElementById('s_n'); addSinpe(b.dataset.m, sn ? sn.value : ''); }
  else if (a === 'sinpe-add') { addSinpe(document.getElementById('s_m').value, document.getElementById('s_n').value); }
  else if (a === 'sinpe-del') { var dz = ensureDay(fechaVista); if (!dz.cerrado) { dz.sinpe.splice(parseInt(b.dataset.i, 10), 1); save(); render(); } }
  else if (a === 'h-now') marcar(b.dataset.w, b.dataset.k);
  else if (a === 'send-all') enviarTodo();
  else if (a === 'exp') exportar(b.dataset.k);
  else if (a === 'unlock') { if (pedirPin()) render(); }
  else if (a === 'lock') { adminUntil = 0; render(); }
  else if (a === 'imp-cat') readFile('f_cat', function (rows) {
    var nuevos = 0, act = 0;
    rows.forEach(function (r) {
      var t = (r.tipo || '').toLowerCase(), c = (r.codigo || '').toUpperCase(); if (!c) return;
      if (t === 'config') {
        if (c === 'PIN' && r.nombre) { S.config.pin = r.nombre; act++; }
        if (c === 'FONDO' && r.nombre) { S.config.fondo = num(r.nombre); act++; }
        return;
      }
      if (t === 'trabajador') {
        var wk = S.trabajadores.filter(function (x) { return x.codigo === c; })[0];
        if (!wk) { wk = { codigo: c, activo: 1 }; S.trabajadores.push(wk); nuevos++; } else act++;
        if (r.nombre) wk.nombre = r.nombre;
        if (r.entrada) wk.entrada = r.entrada;

        if (r.minimo !== '') o.minimo = num(r.minimo); else if (nuevo) o.minimo = 0;
      }

  });
  else if (a === 'imp-con') readFile('f_con', function (rows) {
    var n = 0, bad = [];
    rows.forEach(function (r) {
      var c = (r.codigo || '').toUpperCase(); if (!c) return;
      if (!byCod(S.catalogo.productos, c)) { bad.push(c); return; }
      var delta = num(r.cantidad) - stock(c); if (delta) { S.ajustes.push({ id: Date.now() + n, fecha: hoy(), codigo: c, delta: delta, motivo: 'Conteo CSV' }); n++; }
    });

  });
});
document.addEventListener('change', function (e) {
  var f = e.target.dataset && e.target.dataset.f; if (!f) return;
  var v = e.target.value;
  if (f === 'extra_c') {
    var cx = byCod(e.target.dataset.tipo === 'ingreso' ? S.catalogo.ingresos : S.catalogo.productos, v);

  }
  if (f === 'c_cont') {
    var ce = document.getElementById('c_ent');

    return;
  }
  if (f.indexOf('h_') === 0) { setHora(e.target.dataset.w, f, v); return; }
  if (f === 'fecha') { fechaVista = v || hoy(); render(); return; }
  if (f === 'ingresos' || f === 'ventas' || f === 'consumo') { setQty(f, e.target.dataset.cod, v); return; }
  var d = ensureDay(fechaVista); if (d.cerrado) return;
  if (f === 'cajero') { d.cajero = v; S.ultimoCajero = v; }
  else if (f === 'efectivo_contado') d.efectivo_contado = v;
  else if (f === 'egresos') { if (v === '') delete d.egresos[e.target.dataset.cod]; else d.egresos[e.target.dataset.cod] = num(v); }
  save(); render();
});
